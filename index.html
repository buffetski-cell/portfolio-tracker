<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f1117" />
<link rel="manifest" href="manifest.json" />
<title>Portfolio Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* ───────── CORE THEME ───────── */
:root {
  --bg:#0f1117; --bg-card:#1a1d27; --bg-card-inner:#222633;
  --text-primary:#f0f0f3; --text-secondary:#8a8d9a;
  --accent:#00e5a0; --accent-dim:rgba(0,229,160,.12);
  --red:#ff5c5c; --red-dim:rgba(255,92,92,.12);
  --border:rgba(255,255,255,.06);
  --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--text-primary)}
.hidden{display:none}

/* ───────── UI ELEMENTS ───────── */
.section-title{
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-secondary);margin:20px 0 10px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center;
}
.badge{
  display:none;background:var(--accent);color:#000;
  padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:700;
}
.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.row{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--border);
}
.row:last-child{border-bottom:none}
.fade{opacity:.4}
.checkbox{transform:scale(1.1)}
.right{text-align:right}
.positive{color:var(--accent)}
.negative{color:var(--red)}
.mono{font-family:monospace}

/* ───────── HEADER ───────── */
.header{
  position:sticky;top:0;z-index:10;
  padding:20px;
  background:var(--bg);
  display:flex;justify-content:space-between;
}
</style>
</head>

<body>

<div class="header">
  <h2>Portfolio</h2>
</div>

<div style="padding:16px">

<!-- ───────── ACTION REQUIRED ───────── -->
<div class="section-title">
  <span>Action Required</span>
  <span id="trade-badge" class="badge"></span>
</div>

<div id="trade-tickets-card" class="card">
  <div class="row" style="justify-content:center;color:var(--text-secondary)">
    Loading…
  </div>
</div>

</div>

<script>
/* ───────── CONFIG ───────── */
const CLIENT_ID='564704335340-tr2sgmjopla69831iqe9g21k4ui53m2d.apps.googleusercontent.com';
const SHEET_ID='1aC2V0GQDKz9PiCGn40bfkITbpWmNOtwXl88V2-OikbQ';
const SHEET_GID='289436797';
const SCOPES='https://www.googleapis.com/auth/spreadsheets.readonly';

/* Sheet columns (0‑based) */
const TRADE_ACTION_COL = 40;
const SHARES_COL       = 39;
const DOLLARS_COL      = 38;
const ACCOUNT_COL      = 42;

/* ───────── TIME HELPERS ───────── */
function todayET(){
  return new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
}
function isWeekdayET(){
  const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})).getDay();
  return d!==0 && d!==6;
}
function marketClosedET(){
  const t=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  return t.getHours()>16 || (t.getHours()===16 && t.getMinutes()>=15);
}

/* ───────── TICKET STORAGE ───────── */
function ticketKey(t){return `ticket_done_${todayET()}_${t}`}
function isDone(t){return localStorage.getItem(ticketKey(t))==='1'}
function setDone(t,v){localStorage.setItem(ticketKey(t),v?'1':'0')}

/* ───────── AUTO RESET ───────── */
function resetTicketsIfNewTradingDay(){
  if(!isWeekdayET()) return;
  const last=localStorage.getItem('ticket_last_reset');
  const today=todayET();
  if(last!==today){
    Object.keys(localStorage)
      .filter(k=>k.startsWith('ticket_done_'))
      .forEach(k=>localStorage.removeItem(k));
    localStorage.setItem('ticket_last_reset',today);
  }
}

/* ───────── FETCH SHEET ───────── */
let accessToken=null;

async function fetchRows(){
  const meta=await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?fields=sheets.properties`,
    {headers:{Authorization:`Bearer ${accessToken}`}}
  ).then(r=>r.json());

  const sheet=meta.sheets.find(s=>String(s.properties.sheetId)===SHEET_GID);
  const name=sheet.properties.title;

  const data=await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(name)}`,
    {headers:{Authorization:`Bearer ${accessToken}`}}
  ).then(r=>r.json());

  return data.values||[];
}

/* ───────── RENDER TICKETS ───────── */
function renderTradeTickets(rows){
  const card=document.getElementById('trade-tickets-card');
  const badge=document.getElementById('trade-badge');
  card.innerHTML='';

  if(marketClosedET()){
    badge.style.display='none';
    card.innerHTML=`<div class="row" style="justify-content:center;color:var(--text-secondary)">
      ✅ Market closed — no actions required
    </div>`;
    return;
  }

  const tickets=rows.slice(1)
    .map(r=>({
      t:r[0],
      a:r[TRADE_ACTION_COL],
      s:+r[SHARES_COL]||0,
      d:+String(r[DOLLARS_COL]||'').replace(/[,$]/g,'')||0,
      acct:r[ACCOUNT_COL]
    }))
    .filter(x=>(x.a==='BUY'||x.a==='SELL') && x.s!==0);

  if(!tickets.length){
    badge.style.display='none';
    card.innerHTML=`<div class="row" style="justify-content:center;color:var(--text-secondary)">
      ✅ No trades to execute
    </div>`;
    return;
  }

  badge.textContent=tickets.length;
  badge.style.display='inline-block';

  tickets.forEach(x=>{
    const done=isDone(x.t);
    card.innerHTML+=`
      <div class="row ${done?'fade':''}">
        <div style="display:flex;gap:10px;align-items:center">
          <input class="checkbox" type="checkbox" ${done?'checked':''}
            onchange="setDone('${x.t}',this.checked);
                      this.closest('.row').classList.toggle('fade',this.checked)">
          <div>
            <div class="mono">${x.t}</div>
            <div style="font-size:11px;color:var(--text-secondary)">${x.acct}</div>
          </div>
        </div>
        <div class="right">
          <div>${x.a} ${Math.abs(x.s)}</div>
          <div class="${x.a==='BUY'?'positive':'negative'} mono">$${x.d.toLocaleString()}</div>
        </div>
      </div>`;
  });
}

/* ───────── AUTH + LOAD ───────── */
function parseHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  return h.get('access_token');
}

async function load(){
  accessToken=parseHash();
  if(!accessToken){
    location.href=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${location.origin+location.pathname}&response_type=token&scope=${SCOPES}`;
    return;
  }

  resetTicketsIfNewTradingDay();
  const rows=await fetchRows();
  renderTradeTickets(rows);
}

load();
</script>

</body>
</html>
``
